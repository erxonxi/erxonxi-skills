schema_version: "1.1"
name: repo-plan-crm-feature
tags: [procedure, plan, repo, goal-3]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "In this CRM, when a deal is won I want a follow-up activity created for it and the deal owner notified. Plan it for me; I will review the plan before anything is built. (Environment: the shell in this workspace is read-only and git is not available. Create, change or remove file content with the Write and Edit tools; use the shell only to run commands such as the tests.)"
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
